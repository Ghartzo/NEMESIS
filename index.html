<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEMESIS</title>
    <style>
        /* Estilização para deixar a tela preta e o texto centralizado */
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        a {
            color: #fff;
            text-decoration: none;
            font-size: 3rem;
            letter-spacing: 15px;
            transition: opacity 0.5s;
            cursor: default; /* Remove a mãozinha para não óbvio que é um link */
        }

        a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Quando clicar no texto, o jogador vai para a fase1.html -->
    <a href="fase1.html">NEMESIS</a>

</body>
</html>
