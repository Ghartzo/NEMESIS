<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NEMESIS - FINALIZADO</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }

        .mensagem-final {
            max-width: 600px;
            line-height: 1.6;
            font-size: 1.2rem;
            letter-spacing: 2px;
            /* Efeito de fade in para a mensagem aparecer suavemente */
            animation: fadeIn 5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="mensagem-final">
        O jogador finalizou a prova de sua vida. Ele fez o impossível. Ele teve uma chance e a cumpriu.
    </div>

</body>
</html>
