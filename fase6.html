<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NEMESIS - LEVEL 6</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Courier New', Courier, monospace; 
        }
        .enigma-container { text-align: center; }
        
        img { 
            max-width: 250px; 
            margin-bottom: 30px; 
            /* Removido o filtro de inversão para garantir a leitura do QR */
            border: 5px solid #fff; /* Uma borda branca fina ajuda o celular a focar */
        }

        .location-data { 
            color: #1a1a1a; /* Continua camuflado no fundo preto */
            font-size: 12px; 
            margin-bottom: 20px;
        }

        input { background-color: #000; border: 1px solid #222; color: #444; padding: 12px; text-align: center; outline: none; width: 250px; }
        button { background-color: #050505; color: #222; border: 1px solid #111; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        button:hover { color: #555; }
    </style>
</head>
<body>

    <div class="enigma-container">
        <p style="color: #111;">LEVEL 6</p>

        <img src="qr.png" alt="DATA_STREAM">

        <div class="location-data">
            300 Hidden Figures Way SW, Washington, D.C.
        </div>

        <form id="quiz-form">
            <input type="text" id="answer" placeholder="SENHA" autocomplete="off" required>
            <br>
            <button type="submit">SUBMETER</button>
        </form>
    </div>

    <script>
        document.getElementById('quiz-form').onsubmit = function(e) {
            e.preventDefault();
            const tentativa = document.getElementById('answer').value.toLowerCase().trim();
            
            // RESPOSTA: james webb
            const respostaCerta = "james webb"; 

            if (tentativa === respostaCerta) {
                window.location.href = "fase7.html";
            } else {
                alert("NADA.");
                document.getElementById('answer').value = "";
            }
        };
    </script>
</body>
</html>
