<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NEMESIS - LEVEL 2</title>
    <style>
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Courier New', Courier, monospace; }
        .enigma-container { text-align: center; }
        img { max-width: 500px; width: 100%; margin-bottom: 20px; filter: grayscale(100%); } /* Deixei em P&B para ficar mais sombrio */
        .binario { font-size: 10px; color: #222; margin-bottom: 20px; max-width: 450px; word-wrap: break-word; }
        input { background-color: #000; border: 1px solid #222; color: #444; padding: 12px; text-align: center; outline: none; width: 250px; }
        button { background-color: #050505; color: #222; border: 1px solid #111; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        button:hover { color: #555; }
    </style>
</head>
<body>

    <div class="enigma-container">
        <p style="color: #111;">LEVEL 2</p>
        <img src="socrates.jpg">
        
        <div class="binario">
            01100110 01110010 01100001 01110011 01100101 00100000 01101101 01100001 01101001 01110011 00100000 01100110 01100001 01101101 01101111 01110011 01100001
        </div>

        <form id="quiz-form">
            <input type="text" id="answer" placeholder="SENHA" autocomplete="off" required>
            <br>
            <button type="submit">SUBMETER</button>
        </form>
    </div>

    <script>
        document.getElementById('quiz-form').onsubmit = function(e) {
            e.preventDefault();
            const tentativa = document.getElementById('answer').value.toLowerCase().trim();
            
            // A resposta continua sendo "só sei que nada sei"
            const respostaCerta = "só sei que nada sei"; 

            if (tentativa === respostaCerta) {
                window.location.href = "fase3.html";
            } else {
                alert("NADA.");
                document.getElementById('answer').value = "";
            }
        };
    </script>
</body>
</html>
